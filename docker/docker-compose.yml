name: acumen

x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-acumen}:${RABBITMQ_PASSWORD:-acumen}@rabbitmq:5672
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:-change-me-to-32-plus-chars-secret-key}

services:
  postgres:
    image: postgres:16-alpine
    container_name: acumen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-acumen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acumen}
      POSTGRES_DB: ${POSTGRES_DB:-acumen}
    ports:
      - '${POSTGRES_HOST_PORT:-55432}:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/00-schemas.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-acumen} -d ${POSTGRES_DB:-acumen}']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [acumen-net]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: acumen-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-acumen}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-acumen}
    ports:
      - '${RABBITMQ_HOST_PORT:-5673}:5672'
      - '${RABBITMQ_MGMT_HOST_PORT:-15673}:15672'
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping']
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [acumen-net]

  redis:
    image: redis:7-alpine
    container_name: acumen-redis
    restart: unless-stopped
    ports:
      - '${REDIS_HOST_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [acumen-net]

  api-gateway:
    build:
      context: ..
      dockerfile: apps/api-gateway/Dockerfile
    container_name: acumen-api-gateway
    restart: unless-stopped
    environment:
      <<: *common-env
      GATEWAY_PORT: ${GATEWAY_PORT:-3000}
      DATABASE_URL_GATEWAY: postgresql://${POSTGRES_USER:-acumen}:${POSTGRES_PASSWORD:-acumen}@postgres:5432/${POSTGRES_DB:-acumen}?schema=gateway
    ports:
      - '${GATEWAY_PORT:-3000}:3000'
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/healthz >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [acumen-net]

  portfolio:
    build:
      context: ..
      dockerfile: apps/portfolio/Dockerfile
    container_name: acumen-portfolio
    restart: unless-stopped
    environment:
      <<: *common-env
      PORTFOLIO_HEALTH_PORT: ${PORTFOLIO_HEALTH_PORT:-3001}
      DATABASE_URL_PORTFOLIO: postgresql://${POSTGRES_USER:-acumen}:${POSTGRES_PASSWORD:-acumen}@postgres:5432/${POSTGRES_DB:-acumen}?schema=portfolio
    ports:
      - '${PORTFOLIO_HEALTH_PORT:-3001}:3001'
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/healthz >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [acumen-net]

  notification:
    build:
      context: ..
      dockerfile: apps/notification/Dockerfile
    container_name: acumen-notification
    restart: unless-stopped
    environment:
      <<: *common-env
      NOTIFICATION_HEALTH_PORT: ${NOTIFICATION_HEALTH_PORT:-3002}
      DATABASE_URL_NOTIFICATION: postgresql://${POSTGRES_USER:-acumen}:${POSTGRES_PASSWORD:-acumen}@postgres:5432/${POSTGRES_DB:-acumen}?schema=notification
    ports:
      - '${NOTIFICATION_HEALTH_PORT:-3002}:3002'
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3002/healthz >/dev/null 2>&1 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [acumen-net]

volumes:
  pg-data:
  rmq-data:
  redis-data:

networks:
  acumen-net:
    driver: bridge
