## RabbitMQ runtime config. Topology preloaded from definitions.json.
loopback_users = none
listeners.tcp.default = 5672
management.tcp.port = 15672

## Reload preloaded definitions on every boot so dev rebuilds get a clean topology.
load_definitions = /etc/rabbitmq/definitions.json

## Healthier defaults for a dev box.
disk_free_limit.absolute = 50MB
vm_memory_high_watermark.relative = 0.6

## Default vhost is "/" already; included here for clarity.
default_vhost = /
default_user = acumen
default_pass = acumen
default_user_tags.administrator = true
