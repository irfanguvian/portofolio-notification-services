name: acumen-dev

services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    container_name: acumen-workspace
    command: sleep infinity
    working_dir: /workspace
    volumes:
      - ..:/workspace:cached
      - workspace-pnpm-store:/home/node/.local/share/pnpm/store
    environment:
      NODE_ENV: development
      LOG_LEVEL: info
      DATABASE_URL_GATEWAY: postgresql://acumen:acumen@postgres:5432/acumen?schema=gateway
      DATABASE_URL_PORTFOLIO: postgresql://acumen:acumen@postgres:5432/acumen?schema=portfolio
      DATABASE_URL_NOTIFICATION: postgresql://acumen:acumen@postgres:5432/acumen?schema=notification
      RABBITMQ_URL: amqp://acumen:acumen@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-to-32-plus-chars-secret-key
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [acumen-net]

  postgres:
    image: postgres:16-alpine
    container_name: acumen-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: acumen
      POSTGRES_PASSWORD: acumen
      POSTGRES_DB: acumen
    ports:
      - '${POSTGRES_HOST_PORT:-55432}:5432'
    volumes:
      - dev-pg-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/00-schemas.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U acumen -d acumen']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [acumen-net]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: acumen-dev-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: acumen
      RABBITMQ_DEFAULT_PASS: acumen
    ports:
      - '${RABBITMQ_HOST_PORT:-5673}:5672'
      - '${RABBITMQ_MGMT_HOST_PORT:-15673}:15672'
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - dev-rmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD-SHELL', 'rabbitmq-diagnostics -q ping']
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [acumen-net]

  redis:
    image: redis:7-alpine
    container_name: acumen-dev-redis
    restart: unless-stopped
    ports:
      - '${REDIS_HOST_PORT:-6380}:6379'
    volumes:
      - dev-redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [acumen-net]

volumes:
  dev-pg-data:
  dev-rmq-data:
  dev-redis-data:
  workspace-pnpm-store:

networks:
  acumen-net:
    driver: bridge
